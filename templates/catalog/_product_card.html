{% load static %}
<article class="product-card">
  <a href="{% url 'catalog:product_detail' product.slug %}" class="product-image">
    {% if product.image %}
      <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">
    {% else %}
      <div class="product-image-placeholder" aria-hidden="true">🧉</div>
    {% endif %}
  </a>
  <div class="product-info">
    <p class="product-category">{{ product.category.name }}</p>
    <h3><a href="{% url 'catalog:product_detail' product.slug %}">{{ product.name }}</a></h3>
    <div class="product-price{% if product.has_discount %} product-price-sale{% endif %}">
      {% if product.has_discount %}
        <span class="product-price-original">${{ product.price }}</span>
        <span class="product-price-current">${{ product.current_price }}</span>
        <span class="discount-badge">{{ product.discount_percent }}% OFF</span>
      {% else %}
        <span class="product-price-current">${{ product.price }}</span>
      {% endif %}
    </div>
    <form action="{% url 'orders:cart_add' product.id %}" method="post" class="add-to-cart-form">
      {% csrf_token %}
      <input type="hidden" name="quantity" value="1">
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="btn btn-small" {% if not product.in_stock %}disabled{% endif %}>
        {% if product.in_stock %}Agregar al pedido{% else %}Sin stock{% endif %}
      </button>
    </form>
  </div>
</article>
